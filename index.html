<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>UwU Girls</title>
</head>
<body>
  <center><h1>UwU Girls</h1></center>

  <div class="image">
    <script src="pic.js"></script>
  </div>

  <style>
    div.image {
      position: fixed;
      right: 0px;
      bottom: -5px;
      z-index: -1;
    }
  </style>

  <!-- Random Special Sound Script -->
  <script>
    // Base click sound (always plays)
    const baseSoundFile = "sound/uwu.mp3";

    // Your 12 special sounds from sound/ folder
    const specialFiles = [
      "sound/animebabe.mp3",
      "sound/antabaka.mp3",
      "sound/ara.mp3",
      "sound/ducktoy.mp3",
      "sound/bakabaka.mp3",
      "sound/ahh.mp3",
      "sound/punch.mp3",
      "sound/uhh.mp3",
      "sound/mambo.mp3",
      "sound/ohmygod.mp3",
      "sound/onicha.mp3",
      "sound/wow.mp3"
    ];

    const specialChance = 0.08;        // 8% chance to trigger a special sound
    const specialCooldownMs = 2000;    // cannot play special more than once every 2 seconds

    // Helper to preload audio
    function makeAudio(url) {
      const a = new Audio(url);
      a.preload = "auto";
      return a;
    }

    const baseAudio = makeAudio(baseSoundFile);

    function playOneShot(url) {
      try {
        const a = new Audio(url);
        a.preload = "auto";
        a.currentTime = 0;
        a.play().catch(() => {});
      } catch (e) {}
    }

    let lastSpecialAt = 0;

    document.addEventListener("click", () => {
      // Play main uwu sound each click
      baseAudio.currentTime = 0;
      baseAudio.play().catch(() => {});

      const now = Date.now();

      // Enforce cooldown for special sound
      if (now - lastSpecialAt < specialCooldownMs) return;

      // Random trigger
      if (Math.random() < specialChance) {
        const randomIndex = Math.floor(Math.random() * specialFiles.length);
        playOneShot(specialFiles[randomIndex]);
        lastSpecialAt = now;
      }
    });

    // Preload all sounds on load
    window.addEventListener("load", () => {
      makeAudio(baseSoundFile);
      specialFiles.forEach(f => makeAudio(f));
    });
  </script>

</body>
</html>
